server {
    listen 80;
    server_name _;

    root /www/aura-ui/dist;
    index index.html;

    # 启用 Gzip 深度压缩，提升服务器首屏加载体验
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # 静态资产长效缓存 (带有 hash 的 JS/CSS)
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g|ico)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Vue Router 网页路由 History 模式支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁用目录浏览
    autoindex off;
}
